name: picoshop_theme2
description: "A new Flutter project."
publish_to: 'none' 

# Updated app version for OTA release
version: 1.0.1+2

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  flutter_dotenv: ^5.2.1
  dio: ^5.9.0
  flutter_spinkit: ^5.2.2
  flutter_secure_storage: ^9.2.4
  carousel_slider: ^5.1.1
  google_fonts: ^6.3.1
  device_info_plus: ^11.5.0
  pin_code_fields: ^8.0.1
  shimmer: ^3.0.0
  connectivity_plus: ^6.1.5
  build_runner: ^2.8.0
  image_picker: ^1.2.0
  flutter_lints: ^2.0.0
  easy_localization: ^3.0.8
  path_provider: ^2.1.5
  intl: ^0.20.2
  animations: ^2.1.0
  permission_handler: ^12.0.1
  line_icons: ^2.0.3
  badges: ^3.1.2
  dotted_border: ^3.1.0
  flutter_image_compress: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: "^0.14.4"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/picosbs.jpg"
  adaptive_icon_background: "#1F3B4D"
  adaptive_icon_foreground: "assets/images/picosbs.jpg"

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets: 
    - .env
    - assets/images/picosbs.jpg
    - assets/images/empty.png
    - assets/images/person.png
    - assets/translations/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
