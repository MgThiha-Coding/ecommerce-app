name: picoshop_theme2
description: "A new Flutter project."
publish_to: 'none' 

# Updated app version for OTA release
version: 1.0.2+3

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  flutter_dotenv: ^5.2.1
  dio: ^5.9.0
  flutter_spinkit: ^5.2.2
  flutter_secure_storage: ^9.2.4
  carousel_slider: ^5.1.1
  google_fonts: ^6.3.1
  flutter_html: ^3.0.0
  device_info_plus: ^11.5.0
  pin_code_fields: ^8.0.1
  shimmer: ^3.0.0
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.1.5
  build_runner: ^2.8.0
  image_picker: ^1.2.0
  shared_preferences: ^2.5.3
  go_router: ^16.2.4
  flutter_lints: ^2.0.0
  curved_navigation_bar: ^1.0.6
  easy_localization: ^3.0.8
  path_provider: ^2.1.5
  intl: ^0.20.2
  animations: ^2.1.0
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  permission_handler: ^12.0.1
  google_maps_flutter: ^2.13.1
  flutter_vector_icons: ^2.0.0
  line_icons: ^2.0.3
  badges: ^3.1.2
  flutter_map: ^8.2.2
  flutter_map_location_marker: ^10.1.0
  latlong2: ^0.9.1
  flutter_staggered_grid_view: ^0.7.0
  another_flushbar: ^1.12.32
  flutter_toastr: ^1.0.3
  fluttertoast: ^9.0.0
  ota_update: ^7.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: "^0.14.4"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/picosbs.jpg"
  adaptive_icon_background: "#1F3B4D"
  adaptive_icon_foreground: "assets/images/picosbs.jpg"

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets: 
    - .env
    - assets/images/picosbs.jpg
    - assets/images/empty.png
    - assets/images/person.png
    - assets/translations/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
